# Search goal: tester-frontend-hcm. Paths resolve from seek_job root, not storage/.
# Skills are preferences, not an all-skills-required filter. Move confirmed must-haves to must_have_skills.
# "internal" is interpreted as intern/internship. Target: tester/frontend at HCM.
schema_version: 1
search_profiles:
- id: tester
  target_roles:
  - Tester
  - QA Tester
  - Manual Tester
  - Automation Tester
  - QA Engineer
  - Software Test Engineer
  levels: &id001
  - intern
  - internship
  - fresher
  - entry-level
  - junior
  must_have_skills: []
  preferred_skills:
  - React
  - Angular
  - .NET
- id: frontend
  target_roles:
  - Frontend Developer
  - Front End Developer
  - Frontend Engineer
  - Front End Engineer
  levels: *id001
  must_have_skills: []
  preferred_skills:
  - React
  - Angular
  - .NET
skill_aliases:
  React:
  - React.js
  - ReactJS
  - React JS
  Angular:
  - Angular
  .NET:
  - dotnet
  - .NET Core
  - ASP.NET
  - ASP.NET Core
  - Dot Net
geography:
  job_countries:
  - VN
  work_from_country: VN
  # Residence does not establish legal work authorization; fill only verified countries.
  authorized_work_countries: []
  relocation_allowed: false
  needs_sponsorship: null
  minimum_timezone_overlap_hours: null
  job_cities:
  - Ho Chi Minh City
  work_from_city: Ho Chi Minh City
  city_aliases:
    Ho Chi Minh City:
    - Ho Chi Minh
    - Hồ Chí Minh
    - HCM
    - TP.HCM
    - TP HCM
    - Saigon
    - Sài Gòn
  allow_international_remote: false
work_modes:
- on-site
- hybrid
- remote
employment_types:
- full-time
- part-time
- internship
- contract
exclusions:
  hiring_levels:
  - middle
  - mid-level
  - senior
  - lead
  - principal
  - manager
  unpaid: true
  title_keywords: []
freshness:
  posted_within_days: 7
  unknown_date_policy: needs_review
  max_availability_age_hours: 48
matching:
  unknown_hard_constraint_policy: needs_review
  unknown_required_skill_policy: needs_review
  ranking_weights:
    preferred_skill_coverage: 60
    freshness: 40
sources:
  web_search:
    enabled: true
    priority: 2
    required_for_coverage: true
  company_career_pages:
    enabled: true
    priority: 1
    required_for_coverage: true
  greenhouse:
    enabled: true
    priority: 1
    required_for_coverage: false
  lever:
    enabled: true
    priority: 1
    required_for_coverage: false
  workday:
    enabled: true
    priority: 2
    required_for_coverage: false
  linkedin:
    enabled: true
    priority: 3
    mode: discovery_and_manual
    required_for_coverage: false
  other_public_sources:
    enabled: true
    priority: 3
    required_for_coverage: false
company_boards: []
browser:
  mode: if_available
  on_auth_required: checkpoint_and_continue_other_sources
limits:
  max_queries_per_source: 8
  max_pages_per_source: 8
  max_candidates_per_source: 30
  max_accepted_jobs_per_run: 30
  max_run_minutes: 30
  request_timeout_seconds: 30
  max_retries: 2
  retry_backoff_seconds: 5
  min_request_interval_seconds: 2
  candidate_retry_after_hours: 24
# CV selection happens separately in the UI; search does not select a candidate.
cv_handoff:
  enabled: false
  workspace: ../latex_cv
  config_file: cv.config.yaml
  skill_file: .codex/skills/latex-cv-tailor/SKILL.md
  allowed_availability_statuses:
  - open
  profile_gap_check: false
# Legacy storage namespace preserves existing history and dedup; it does not select a CV profile.
output:
  jobs_directory: jobs/hang
  runs_directory: runs/hang
  state_file: state/hang/jobs-index.json
  candidates_file: state/hang/candidates.json
