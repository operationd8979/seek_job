# Search goal: fullstack-devops-hcm-remote. Paths resolve from seek_job root, not storage/.
# Skills are preferences, not an all-skills-required filter. Move confirmed must-haves to must_have_skills.
# Target: HCM OR international remote that permits working from Vietnam.
# Docker/Kubernetes/CI-CD/Terraform are optional DevOps suggestions for the supplied "...".
schema_version: 1
search_profiles:
- id: fullstack
  target_roles:
  - Full Stack Developer
  - Full Stack Engineer
  - Fullstack Developer
  - Fullstack Engineer
  levels: &id001
  - middle
  - mid
  - mid-level
  - intermediate
  - senior
  must_have_skills: []
  preferred_skills:
  - Angular
  - Azure
  - Cloud
  - Microservices
- id: devops
  target_roles:
  - DevOps Engineer
  - DevOps Developer
  - DevOps
  levels: *id001
  must_have_skills: []
  preferred_skills:
  - Azure
  - Cloud
  - Microservices
  - Angular
  - Docker
  - Kubernetes
  - CI/CD
  - Terraform
skill_aliases:
  Angular:
  - Angular
  Azure:
  - Microsoft Azure
  Cloud:
  - Cloud computing
  - Cloud infrastructure
  - Cloud platform
  Microservices:
  - Microservice
  - Microservice architecture
  - Microservices architecture
  CI/CD:
  - CI CD
  - Continuous Integration
  - Continuous Delivery
  - Continuous Deployment
  Kubernetes:
  - K8s
geography:
  job_countries:
  - VN
  work_from_country: VN
  # Residence does not establish legal work authorization; fill only verified countries.
  authorized_work_countries: []
  relocation_allowed: false
  needs_sponsorship: null
  minimum_timezone_overlap_hours: null
  job_cities:
  - Ho Chi Minh City
  work_from_city: Ho Chi Minh City
  city_aliases:
    Ho Chi Minh City:
    - Ho Chi Minh
    - Hồ Chí Minh
    - HCM
    - TP.HCM
    - TP HCM
    - Saigon
    - Sài Gòn
  allow_international_remote: true
work_modes:
- remote
- hybrid
- on-site
employment_types:
- full-time
- contract
exclusions:
  hiring_levels:
  - intern
  - internship
  - fresher
  - entry-level
  - junior
  - lead
  - principal
  - manager
  unpaid: true
  title_keywords:
  - internship
  - fresher
freshness:
  posted_within_days: 7
  unknown_date_policy: needs_review
  max_availability_age_hours: 48
matching:
  unknown_hard_constraint_policy: needs_review
  unknown_required_skill_policy: needs_review
  ranking_weights:
    preferred_skill_coverage: 60
    freshness: 40
sources:
  web_search:
    enabled: true
    priority: 2
    required_for_coverage: true
  company_career_pages:
    enabled: true
    priority: 1
    required_for_coverage: true
  greenhouse:
    enabled: true
    priority: 1
    required_for_coverage: false
  lever:
    enabled: true
    priority: 1
    required_for_coverage: false
  workday:
    enabled: true
    priority: 2
    required_for_coverage: false
  linkedin:
    enabled: true
    priority: 3
    mode: discovery_and_manual
    required_for_coverage: false
  other_public_sources:
    enabled: true
    priority: 3
    required_for_coverage: false
company_boards: []
browser:
  mode: if_available
  on_auth_required: checkpoint_and_continue_other_sources
limits:
  max_queries_per_source: 8
  max_pages_per_source: 8
  max_candidates_per_source: 30
  max_accepted_jobs_per_run: 30
  max_run_minutes: 30
  request_timeout_seconds: 30
  max_retries: 2
  retry_backoff_seconds: 5
  min_request_interval_seconds: 2
  candidate_retry_after_hours: 24
# CV selection happens separately in the UI; search does not select a candidate.
cv_handoff:
  enabled: false
  workspace: ../latex_cv
  config_file: cv.config.yaml
  skill_file: .codex/skills/latex-cv-tailor/SKILL.md
  allowed_availability_statuses:
  - open
  profile_gap_check: false
# Legacy storage namespace preserves existing history and dedup; it does not select a CV profile.
output:
  jobs_directory: jobs/dung
  runs_directory: runs/dung
  state_file: state/dung/jobs-index.json
  candidates_file: state/dung/candidates.json
